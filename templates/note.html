{% extends 'base.html' %}

{% block content %}
  <article>
    <h2>{{ note.title }}</h2>
    <div>
      <small>Created {{ note.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
      {% if note.favorite %}
        <span class="star">⭐</span>
      {% endif %}
    </div>
    <hr>
    <div>
      {{ (note.content or '') | e | replace('\n', '<br>') | safe }}
    </div>
  </article>
  <p>
    <a href="{{ url_for('notes') }}">Back to all notes</a> |
    <a href="{{ url_for('edit', note_id=note.id) }}">Edit</a>
    |
    <form method="post" action="{{ url_for('delete', note_id=note.id) }}" style="display:inline" onsubmit="return confirm('Delete this note?');">
      <button type="submit">Delete</button>
    </form>
  </p>
{% endblock %}
